minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Both are the last versions of their major lines and were published without
  # an npm attestation, which the policy reads as a downgrade. See ADR-0006.
  - chokidar@4.0.3
  - semver@6.3.1

shellEmulator: true
trustPolicyExcludePrune: true

overrides:
  # Only @intlify/eslint-plugin-vue-i18n asks for glob 10, which is vulnerable
  # (GHSA-3g3m-2fjr-6pw4) and has no patched 10.x. The plugin runs at lint time.
  '@intlify/eslint-plugin-vue-i18n>glob': ^14.0.2

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
