version: 2
updates:
  # `npm` is the ecosystem for pnpm lockfiles as well; there is no `pnpm` one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A week gives the registry time to pull a hijacked release before a PR
    # proposes it. Security updates ignore the cooldown and still arrive at once.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
