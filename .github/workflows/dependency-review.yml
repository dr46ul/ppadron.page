name: Dependency review

on: pull_request

permissions:
  contents: read

jobs:
  review:
    name: Review new dependencies
    runs-on: ubuntu-latest

    # The action reads the dependency graph, which is free on public
    # repositories and part of Advanced Security on private ones. Skipping while
    # the repo is private keeps it from failing every pull request, and the job
    # starts running on its own once the repo goes public.
    if: github.event.repository.visibility == 'public'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Moderate rather than the action's `low` default: a portfolio site pulls
      # few runtime dependencies, so the level that would actually block a merge
      # is the one worth failing on.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
