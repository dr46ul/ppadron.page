name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A weekly run catches queries CodeQL adds after the code was last touched,
    # which is most of what a site this size will ever hear from it.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest

    # Code scanning is free on public repositories and part of Advanced
    # Security, which personal accounts cannot buy, on private ones. Skipping
    # while the repo is private keeps the run from failing on the upload, and
    # the job starts analysing on its own once the repo goes public.
    if: github.event.repository.visibility == 'public'

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build step: CodeQL reads TypeScript and Vue sources directly, and a
      # Nuxt build would only hide them behind bundled output.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
