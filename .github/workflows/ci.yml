name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, and the default token for a workflow
# without this block carries write access across most of the repo's scopes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `postinstall` runs `nuxt prepare`, which generates the .nuxt types the
      # typecheck and the nuxt test project both read.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Runs all three projects. The e2e one builds the app, so it is the slow
      # step; it is also the only thing covering the server-rendered HTML.
      - run: pnpm test
