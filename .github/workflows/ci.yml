name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, and the default token for a workflow
# without this block carries write access across most of the repo's scopes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `postinstall` runs `nuxt prepare`, which generates the .nuxt types the
      # typecheck and the nuxt test project both read.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Runs all three projects. The e2e one builds the app, so it is the slow
      # step; it is also the only thing covering the server-rendered HTML.
      - run: pnpm test
